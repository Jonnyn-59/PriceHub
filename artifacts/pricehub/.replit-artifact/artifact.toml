kind = "web"
previewPath = "/"
title = "PriceHub"
version = "1.0.0"
id = "artifacts/pricehub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23278

[services.development]
run = "pnpm --filter @workspace/pricehub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pricehub", "run", "build" ]
publicDir = "artifacts/pricehub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23278"
BASE_PATH = "/"
